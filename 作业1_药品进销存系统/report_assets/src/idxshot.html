<!DOCTYPE html><html><head><meta charset="utf-8"></head><body style="margin:0">
<iframe id="f" src="http://127.0.0.1:5001/ops?tab=report" style="width:1400px;height:900px;border:0"></iframe>
<script>
const f = document.getElementById('f');
f.addEventListener('load', () => {
  setTimeout(() => {
    try {
      const d = f.contentDocument;
      const sel = d.getElementById('tDrug');
      const opts = Array.from(sel.options).filter(o => o.value);
      sel.value = opts[Math.floor(opts.length / 2)].value;
      sel.dispatchEvent(new Event('change'));
      d.getElementById('btnIdx').click();
    } catch(e) { document.title = 'ERR:' + e; }
  }, 6000);
});
</script></body></html>
